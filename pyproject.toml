[project]
name = "sp-registry"
version = "2.3.0"
requires-python = ">=3.10"
dependencies = [
    "cryptography==50.0.0",
    "django==5.2.17",
    "django-bootstrap5==26.2",
    "django-filter==25.2",
    "djangorestframework==3.17.1",
    "docutils==0.23",
    "drf-spectacular==0.29.0",
    "gitpython==3.1.57",
    "lxml==6.1.1",
    "python-dateutil==2.9.0",
]

[project.optional-dependencies]
mysql = [
    "mysqlclient==2.2.8",
]
postgresql = [
    "psycopg==3.3.4",
]

[tool.uv]
audit.malware-check = true
exclude-newer = "7 days"
exclude-newer-package = { django = false, cryptography = false }

[tool.isort]
profile = "black"
skip_gitignore = true

[tool.black]
line-length = 119

[dependency-groups]
dev = [
    "behave-django==2.0.0",
    "black==26.5.1",
    "coverage==7.15.2",
    "factory-boy==3.3.3",
    "faker==40.36.0",
    "isort==7.0.0",
    "selenium==4.40.0",
    "splinter==0.21.0",
]
