variables:
  UV_VERSION: "0.12.1"
  PYTHON_VERSION: "3.10"
  BASE_LAYER: trixie
  UV_LINK_MODE: copy
  UV_CACHE_DIR: .uv-cache

image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER

cache:
  key:
    files:
      - uv.lock
  paths:
    - $UV_CACHE_DIR

stages:
  - lint
  - test
  - analyse

.script_template_venv:
  before_script:
    - python -V
    - uv sync --frozen

.script_template_venv_with_gecko:
  before_script:
    - apt update && apt install -y firefox-esr
    - curl -fL -o /tmp/geckodriver.tar.gz https://github.com/mozilla/geckodriver/releases/download/v0.36.0/geckodriver-v0.36.0-linux64.tar.gz
    - tar -xzf /tmp/geckodriver.tar.gz -C /tmp/ && chmod +x /tmp/geckodriver && mv /tmp/geckodriver /usr/local/bin/
    - python -V
    - uv sync --frozen

tests:
  stage: test
  extends: .script_template_venv_with_gecko
  script:
    - COVERAGE_FILE=.coverage.unit uv run coverage run ./manage.py test --settings=settings.test
    - COVERAGE_FILE=.coverage.integration uv run coverage run ./manage.py behave --settings=settings.test
    - uv run coverage combine
    - uv run coverage xml
  artifacts:
    expire_in: 2 days
    paths:
      - coverage.xml
  needs: []

black:
  stage: lint
  extends: .script_template_venv
  script:
    - uv run black . --check
  needs: []

isort:
  stage: lint
  extends: .script_template_venv
  script:
    - uv run isort . --check
  needs: []

sonarqube-check:
  stage: analyse
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  before_script:
    - ''
  script:
    - >
      sonar-scanner
      -Dsonar.qualitygate.wait=true
      -Dsonar.host.url=${CI_SONAR_HOST}
      -Dsonar.token=${CI_SONAR_TOKEN}
  allow_failure: true
  needs:
    - job: tests
      artifacts: true

uv-audit:
  stage: analyse
  script:
    - uv audit
  allow_failure: true
