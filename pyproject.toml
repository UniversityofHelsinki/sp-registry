[project]
name = "sp-registry"
version = "2.3.0"
requires-python = ">=3.11"
dependencies = [
    "cryptography==50.0.2",
    "django==5.2.18",
    "django-bootstrap5==26.4",
    "django-filter==26.2",
    "djangorestframework==3.18.3",
    "docutils==0.23",
    "drf-spectacular==0.30.0",
    "gitpython==3.2.1",
    "lxml==6.1.3",
    "python-dateutil==2.9.0",
]

[project.optional-dependencies]
mysql = [
    "mysqlclient==2.3.0",
]
postgresql = [
    "psycopg==3.3.6",
]

[tool.uv]
audit.malware-check = true
exclude-newer = "7 days"
exclude-newer-package = { django = false, certifi = "P3D" }

[tool.isort]
profile = "black"
skip_gitignore = true

[tool.black]
line-length = 119

[dependency-groups]
dev = [
    "behave-django==2.0.0",
    "black==26.10.1",
    "coverage==7.16.2",
    "factory-boy==3.3.3",
    "faker==40.36.0",
    "isort==7.0.0",
    "selenium==4.40.0",
    "splinter==0.21.0",
]
